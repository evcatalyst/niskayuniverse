<!doctype html>
<html lang="en" data-base-path="/niskayuniverse/">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Marker preview | Water Atlas</title>
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <style>
      body {
        margin: 0;
        font-family: system-ui, sans-serif;
        background: #f8fafc;
      }
      header {
        padding: 16px;
        background: #0ea5e9;
        color: #fff;
      }
      #map {
        height: 70vh;
        border-radius: 12px;
        margin: 16px;
        box-shadow: 0 12px 30px rgba(14, 165, 233, 0.25);
      }
      .panel {
        margin: 16px;
        padding: 12px 16px;
        background: #fff;
        border-radius: 12px;
        border: 1px solid #e2e8f0;
      }
      label {
        display: block;
        margin-bottom: 6px;
        font-weight: 700;
      }
      select {
        padding: 8px;
        border-radius: 10px;
        border: 1px solid #cbd5e1;
        width: 220px;
      }
    </style>
  </head>
  <body>
    <header>
      <h1>Service line marker preview</h1>
      <p>Loads the same data used by the main site for quick visual checks.</p>
    </header>
    <div id="map" aria-label="Service line preview map"></div>
    <div class="panel">
      <label for="status-filter">Filter by status</label>
      <select id="status-filter">
        <option value="all">All</option>
        <option value="verified">Verified</option>
        <option value="unknown">Unknown</option>
      </select>
    </div>
    <script>
      const baseFromDir = new URL('.', document.baseURI).pathname
      const rawBase = document.documentElement.dataset.basePath || baseFromDir
      const basePath = rawBase.replace(/examples\/?$/, '')
      const originBase = `${window.location.origin}${basePath}`
      const serviceLinesUrl = new URL('data/service_lines.geojson', originBase).pathname
      const statusFilter = document.getElementById('status-filter')
      const map = L.map('map').setView([42.8073, -73.8945], 13)
      L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
        maxZoom: 19,
        attribution: '&copy; OpenStreetMap contributors',
      }).addTo(map)
      let layer

      const colors = { verified: '#22c55e', unknown: '#94a3b8', default: '#0ea5e9' }

      function render(data) {
        if (layer) layer.remove()
        layer = L.geoJSON(data, {
          filter: (feature) =>
            statusFilter.value === 'all'
              ? true
              : (feature.properties?.status || '').toLowerCase() === statusFilter.value,
          pointToLayer: (feature, latlng) => {
            const status = (feature.properties?.status || '').toLowerCase()
            const color = colors[status] || colors.default
            return L.circleMarker(latlng, {
              radius: 8,
              color,
              weight: 2,
              fillColor: color,
              fillOpacity: 0.8,
            })
          },
          onEachFeature: (feature, layer) => {
            const props = feature.properties || {}
            layer.bindPopup(
              `<strong>${props.address || 'Service line'}</strong><br/>Private: ${props.private_material || 'n/a'}<br/>Public: ${props.public_material || 'n/a'}`
            )
          },
        }).addTo(map)
      }

      fetch(serviceLinesUrl)
        .then((res) => res.json())
        .then((geojson) => {
          render(geojson)
          statusFilter.addEventListener('change', () => render(geojson))
        })
        .catch((err) => console.error('Failed to load markers', err))
    </script>
  </body>
</html>
