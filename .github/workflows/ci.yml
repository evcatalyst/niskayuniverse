name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Lint code
        run: npm run lint

      - name: Type check
        run: npm run typecheck

      - name: Run unit tests
        run: npm test

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium

      - name: Build
        id: build
        run: npm run build
        continue-on-error: true

      - name: Retry build with clean install
        if: steps.build.outcome == 'failure'
        run: |
          rm -rf node_modules package-lock.json
          npm install
          npm run build

      - name: Run E2E tests
        run: npm run test:e2e