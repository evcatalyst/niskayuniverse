name: Data Sync

on:
  # schedule:
  #   - cron: '0 */1 * * *'  # Every hour - DISABLED to prevent constant failures
  workflow_dispatch:

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Fetch and process data
        env:
          SERVICE_LINES_URL: ${{ vars.SERVICE_LINES_URL }}
          SUBMISSIONS_URL: ${{ vars.SUBMISSIONS_URL }}
        run: |
          node scripts/fetch-data.mjs
          npm run fetch:parcels

      - name: Validate data files
        run: npm run validate:data

      - name: Check for changes
        id: verify-changed-files
        run: |
          if [ -n "$(git status --porcelain public/data/)" ]; then
            echo "changed=true" >> $GITHUB_OUTPUT
          else
            echo "changed=false" >> $GITHUB_OUTPUT
          fi

      - name: Commit changes
        if: steps.verify-changed-files.outputs.changed == 'true'
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action"
          git add public/data/
          git commit -m "chore(data): update data files"
          git push
