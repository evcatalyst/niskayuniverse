# Simple workflow for deploying static content to GitHub Pages
name: Deploy static content to Pages

on:
  # Runs on pushes targeting the default branch
  push:
    branches: ["main"]

  # Allows you to run this workflow manually from the Actions tab
  workflow_dispatch:

# Sets permissions of the GITHUB_TOKEN to allow deployment to GitHub Pages
permissions:
  contents: read
  pages: write
  id-token: write

# Allow only one concurrent deployment, skipping runs queued between the run in-progress and latest queued.
# However, do NOT cancel in-progress runs as we want to allow these production deployments to complete.
concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  # Single deploy job since we're just deploying
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          # Disable npm caching to avoid optional dependency issues
          cache: false
      - name: Install dependencies
        run: |
          npm ci
          # Force install optional dependencies if needed
          npm rebuild
      - name: Verify npm cache integrity
        run: |
          if npm cache verify 2>/dev/null; then
            echo "✅ NPM cache is valid"
          else
            echo "⚠️ NPM cache issues detected, clearing..."
            npm cache clean --force
          fi
      - name: Build
        id: build
        run: npm run build
      - name: Retry build with clean install
        if: failure()
        run: |
          echo "Build failed, attempting clean reinstall..."
          rm -rf node_modules package-lock.json
          npm install
          npm run build
      - name: Setup Pages
        uses: actions/configure-pages@v5
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          # Upload built files from dist directory
          path: './dist'
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
      - name: Verify deployment
        run: |
          # Wait for deployment to propagate
          sleep 30
          # Check if the site loads correctly
          if curl -s "https://evcatalyst.github.io/niskayuniverse/" | grep -q "Niskayuna Water Quality Atlas"; then
            echo "✅ Deployment successful - site loads correctly"
          else
            echo "❌ Deployment failed - site not loading correctly"
            exit 1
          fi