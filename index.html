<!DOCTYPE html><html lang="en"> <head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Niskayuna Water Quality Atlas</title><link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"><script type="module" src="/niskayuniverse/_astro/hoisted.BtWyln1_.js"></script></head> <body> <header> <h1>Niskayuna Water Quality Atlas</h1> <p>Community-powered water monitoring</p> </header> <main> <div id="map" style="height:70vh;border-radius:8px;"></div>  <form id="submit-form" style="display:block;max-width:400px;margin:20px auto;padding:20px;border:1px solid #ccc;border-radius:8px;"> <h3>Submit Water Quality Test</h3> <label for="email">Email (for attribution):</label> <input type="email" id="email" name="email" required placeholder="your.email@example.com"> <label for="address">Address:</label> <div style="position:relative;"> <input type="text" id="address" name="address" required placeholder="Start typing an address in Niskayuna..." autocomplete="off"> <div id="address-suggestions" style="position:absolute;top:100%;left:0;right:0;background:white;border:1px solid #ccc;border-top:none;max-height:200px;overflow-y:auto;display:none;z-index:1000;"></div> </div> <label for="ph">pH (0-14):</label> <input type="number" id="ph" name="ph" step="0.1" min="0" max="14" placeholder="7.2"> <label for="tds">TDS (ppm):</label> <input type="number" id="tds" name="tds" min="0" placeholder="150"> <label for="temperature">Temperature (°F):</label> <input type="number" id="temperature" name="temperature" step="0.1" placeholder="68"> <label for="lead">Lead (ppb, optional):</label> <input type="number" id="lead" name="lead" min="0" placeholder="2"> <label for="notes">Notes:</label> <textarea id="notes" name="notes" maxlength="500" placeholder="Test conditions, observations..."></textarea> <button type="submit">Submit Test</button> </form>  </main> <script type="module" src="sw-register.js"></script> </body> </html><!-- Cache bust
